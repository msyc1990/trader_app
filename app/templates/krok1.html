<div id="kontener-kroku" class="space-y-4">
    <div class="flex justify-between items-center bg-stone-950 p-2 rounded-lg border border-stone-800">
        <span class="text-xs font-mono text-purple-400">ETAP 1 z 4</span>
        <span class="text-[10px] font-mono text-stone-500 uppercase">Inicjalizacja Pozycji</span>
    </div>

    <form hx-post="/auth/hud/krok2" hx-target="#kontener-kroku" hx-swap="outerHTML" class="space-y-4">
        <div class="relative">
            <label class="block text-xs font-mono uppercase text-stone-400 mb-1">Wybierz Aktywo</label>
            <input type="text" 
                   id="aktywo-input" 
                   name="aktywo" 
                   autocomplete="off" 
                   placeholder="Wpisz token (np. BTC, ETH, SOL)..." 
                   hx-post="/auth/hud/szukaj-tokena" 
                   hx-trigger="keyup delay:200ms" 
                   hx-target="#wyniki-szukania"
                   required
                   class="bg-gray-900 text-green-400 border border-green-500 rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-green-500 font-mono text-sm">
            <div id="wyniki-szukania" class="absolute z-50 w-full max-h-48 overflow-y-auto rounded bg-gray-900 shadow-xl mt-1 border border-green-500"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-mono uppercase text-stone-400 mb-1">Interwał</label>
                <select name="interwal" class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-stone-100 font-mono focus:outline-none focus:border-purple-500">
                    <option value="H1">H1 (1 Godzina)</option>
                    <option value="H4">H4 (4 Godziny)</option>
                    <option value="D1">D1 (1 Dzień)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-mono uppercase text-stone-400 mb-1">Kierunek</label>
                <select name="kierunek" class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-stone-100 font-mono focus:outline-none focus:border-purple-500">
                    <option value="LONG">🟢 LONG</option>
                    <option value="SHORT">🔴 SHORT</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-xs font-mono uppercase text-stone-400 mb-1">Ryzyko Kapitału (%)</label>
            <input type="number" name="procent_ryzyka" step="0.1" min="0.1" max="10.0" value="1.0" required
                   class="bg-gray-900 text-green-400 border border-green-500 rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <button type="submit" class="w-full bg-stone-800 hover:bg-purple-600 text-stone-300 hover:text-white font-mono text-xs uppercase tracking-wider py-2.5 rounded-lg border border-stone-700 hover:border-purple-500 transition-all cursor-pointer">
            Analizuj Otoczenie (Dalej) ->
        </button>
    </form>
</div>
