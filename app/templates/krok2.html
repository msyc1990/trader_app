<div id="kontener-kroku" class="space-y-4 animate-fade-in">
    <div class="flex justify-between items-center bg-stone-950 p-2 rounded-lg border border-stone-800">
        <span class="text-xs font-mono text-purple-400">ETAP 2 z 4</span>
        <span class="text-[10px] font-mono text-stone-400 uppercase font-bold">{{ aktywo }} / {{ interwal }} / {{ kierunek }}</span>
    </div>

    <form hx-post="/auth/hud/krok3" hx-target="#kontener-kroku" hx-swap="outerHTML" class="space-y-4">
        <input type="hidden" name="aktywo" value="{{ aktywo }}">
        <input type="hidden" name="interwal" value="{{ interwal }}">
        <input type="hidden" name="kierunek" value="{{ kierunek }}">

        <div>
            <label class="text-[11px] text-stone-500 block uppercase mb-1">Cena Wejścia (Live z Binance)</label>
            <input type="number" name="cena_wejscia" step="0.0001" required 
           value="{{ cena_wejscia }}" 
           class="w-full bg-stone-900 border border-stone-800 rounded-lg p-2 text-stone-100 focus:outline-none focus:border-purple-500 text-xs font-mono">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-mono uppercase text-stone-400 mb-1">Kwota Pozycji (USDC)</label>
                <input type="number" name="kwota_pozycji" step="0.01" required placeholder="np. 50"
                       class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-stone-100 font-mono focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs font-mono uppercase text-stone-400 mb-1">Aktualne RSI (14)</label>
                <input type="number" name="aktualne_rsi" step="0.1" required placeholder="np. 42.5"
                       class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-stone-100 font-mono focus:outline-none focus:border-purple-500">
            </div>
        </div>

        <div class="flex gap-2">
            <button type="button" hx-get="/auth/hud" hx-target="#app-container" hx-swap="innerHTML"
                    class="w-1/3 bg-stone-950 hover:bg-stone-900 text-stone-500 hover:text-stone-300 font-mono text-xs uppercase py-2.5 rounded-lg border border-stone-800 transition-all cursor-pointer">
                Anuluj
            </button>
            <button type="submit" 
                    class="w-2/3 bg-purple-600 hover:bg-purple-500 text-white font-mono text-xs uppercase tracking-wider py-2.5 rounded-lg shadow-lg shadow-purple-950/30 transition-all cursor-pointer">
                Oblicz Ryzyko (Dalej) ->
            </button>
        </div>
    </form>
</div>
