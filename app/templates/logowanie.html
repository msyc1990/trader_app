{% extends "baza.html" %}

{% block content %}
<div class="space-y-6">
    <div class="text-center">
        <h2 class="text-2xl font-bold text-purple-400 font-mono tracking-wider">WERYFIKACJA TOŻSAMOŚCI</h2>
        <p class="text-stone-400 text-sm mt-1">Podaj kryptonim i hasło</p>
    </div>

    <div id="error-message" class="text-rose-500 text-sm font-mono text-center"></div>

    <form hx-post="/auth/logowanie" hx-target="#app-container" hx-swap="innerHTML" class="space-y-4">
        <div>
            <label class="block text-xs font-mono uppercase tracking-wider text-stone-400 mb-1">Kryptonim</label>
            <input type="text" name="username" required
                   class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-stone-100 font-mono focus:outline-none focus:border-purple-500 transition-colors">
        </div>

        <div>
            <label class="block text-xs font-mono uppercase tracking-wider text-stone-400 mb-1">Hasło</label>
            <input type="password" name="password" required
                   class="w-full bg-stone-950 border border-stone-800 rounded-lg px-3 py-2 text-stone-100 font-mono focus:outline-none focus:border-purple-500 transition-colors">
        </div>

        <button type="submit" 
                class="w-full bg-purple-600 hover:bg-purple-500 active:bg-purple-700 text-white font-mono uppercase tracking-widest text-sm font-bold py-3 px-4 rounded-xl shadow-lg shadow-purple-900/20 transition-all cursor-pointer">
            Autoryzuj wejście
        </button>
    </form>

    <div class="text-center pt-2">
        <button hx-get="/auth/rejestracja" hx-target="#app-container" hx-swap="innerHTML" 
                class="text-xs text-stone-500 hover:text-purple-400 font-mono underline transition-colors cursor-pointer">
            Nowy rekrut? Załóż profil
        </button>
    </div>
</div>
{% endblock %}
